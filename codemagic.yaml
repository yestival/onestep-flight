workflows:
  android-debug:
    name: OneStep Flight - Android debug, tests and lint
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 22.21.1
      java: 21
    scripts:
      - name: Locked dependencies and shared regressions
        script: npm ci --prefix mobile && npm test --prefix mobile
      - name: Android tests, lint and debug APK
        script: npm run android:check --prefix mobile
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk
      - mobile/android/app/build/reports/lint-results-debug.html
      - mobile/android/app/build/test-results/testDebugUnitTest/*.xml
  android-release:
    name: OneStep Flight - signed Android APK and AAB
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 22.21.1
      java: 21
      groups:
        - android_signing
        - android_firebase
      vars:
        REQUIRE_FCM: "true"
    scripts:
      - name: Locked dependencies and regressions
        script: npm ci --prefix mobile && npm test --prefix mobile
      - name: Decode securely injected signing key
        script: |
          set -eu
          : "${ANDROID_KEYSTORE_BASE64:?Set ANDROID_KEYSTORE_BASE64}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$CM_BUILD_DIR/mobile/build-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$CM_BUILD_DIR/mobile/build-release.jks" >> "$CM_ENV"
      - name: Validate Firebase and build signed APK and AAB
        script: npm run android:check --prefix mobile && npm run android:release --prefix mobile
    artifacts:
      - mobile/android/app/build/outputs/apk/release/*.apk
      - mobile/android/app/build/outputs/bundle/release/*.aab
  iphone-simulator:
    name: OneStep Flight - unsigned iPhone Simulator
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 26.3
      node: 22.21.1
      java: 17
    scripts:
      - name: Install locked dependencies
        script: npm ci --prefix mobile
      - name: Shared frontend and migration tests
        script: npm test --prefix mobile
      - name: Backend regression and CORS tests
        script: bash mvnw test
      - name: Package bundled assets and sync SPM plugins and targets
        script: npm run sync --prefix mobile
      - name: Compile main App and embedded Widget without signing
        script: npm run ios:simulator --prefix mobile
    artifacts:
      - mobile/build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - target/surefire-reports/*.xml

  iphone-signed:
    name: OneStep Flight - manual signed archive / optional TestFlight upload
    instance_type: mac_mini_m2
    max_build_duration: 60
    # No triggering or publishing section: start manually; uploading is opt-in.
    environment:
      xcode: 26.3
      node: 22.21.1
      groups:
        - ios_signing
      ios_signing:
        provisioning_profiles:
          - profile: onestep_app_store
            environment_variable: APP_PROFILE_PATH
          - profile: onestep_widget_app_store
            environment_variable: WIDGET_PROFILE_PATH
        certificates:
          - onestep_distribution
    scripts:
      - name: Check signing inputs
        script: |
          set -eu
          : "${APPLE_TEAM_ID:?Set APPLE_TEAM_ID in secure environment group ios_signing}"
          : "${PROJECT_BUILD_NUMBER:?Codemagic project-wide build counter is required}"
          : "${APP_PROFILE_PATH:?Add onestep_app_store provisioning profile}"
          : "${WIDGET_PROFILE_PATH:?Add onestep_widget_app_store provisioning profile}"
          test -f "$APP_PROFILE_PATH"
          test -f "$WIDGET_PROFILE_PATH"
      - name: Install locked dependencies
        script: npm ci --prefix mobile
      - name: Shared frontend and migration tests
        script: npm test --prefix mobile
      - name: Package and sync iPhone targets
        script: npm run sync --prefix mobile
      - name: Sign both targets, archive, and export IPA
        script: npm run ios:archive --prefix mobile
      - name: Optional upload for internal TestFlight testing only
        script: |
          if [ "${UPLOAD_TO_TESTFLIGHT:-false}" = "true" ]; then
            npm run ios:upload --prefix mobile
          else
            echo "Upload disabled. Signed archive is available as a build artifact."
          fi
    artifacts:
      - mobile/build/ipa/*.ipa
      - mobile/build/OneStepFlight.xcarchive
      - mobile/build/DerivedData/Logs/Build/*.xcactivitylog

  ios-testflight:
    name: OneStep Flight - main to internal TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'mobile/'
          - 'src/main/'
          - 'src/test/'
          - 'scripts/browser-acceptance.mjs'
          - 'scripts/generate-airport-resources-report.mjs'
          - '.mvn/'
          - 'mvnw'
          - 'mvnw.cmd'
          - 'pom.xml'
          - '.gitattributes'
          - 'codemagic.yaml'
        excludes:
          - '**/*.md'
    # This is the only workflow with Git triggers. Other workflows stay manual.
    integrations:
      app_store_connect: onestep_app_store_connect
    environment:
      xcode: 26.3
      node: 22.21.1
      java: 17
      groups:
        - ios_signing
      ios_signing:
        provisioning_profiles:
          - profile: onestep_app_store
            environment_variable: APP_PROFILE_PATH
          - profile: onestep_widget_app_store
            environment_variable: WIDGET_PROFILE_PATH
        certificates:
          - onestep_distribution
    scripts:
      - name: Check signing inputs
        script: |
          set -eu
          : "${APPLE_TEAM_ID:?Set APPLE_TEAM_ID in secure environment group ios_signing}"
          : "${PROJECT_BUILD_NUMBER:?Codemagic project-wide build counter is required}"
          : "${APP_PROFILE_PATH:?Add onestep_app_store provisioning profile}"
          : "${WIDGET_PROFILE_PATH:?Add onestep_widget_app_store provisioning profile}"
          test -f "$APP_PROFILE_PATH"
          test -f "$WIDGET_PROFILE_PATH"
      - name: Install locked dependencies
        script: npm ci --prefix mobile
      - name: Shared frontend and signing validation tests
        script: npm test --prefix mobile
      - name: Backend regression and CORS tests
        script: bash mvnw test
      - name: Allocate unique build number and validate internal TestFlight group
        script: node mobile/scripts/testflight.mjs prepare
      - name: Package bundled assets and sync SPM plugins and targets
        script: npm run sync --prefix mobile
      - name: Sign main App and Widget, archive and export App Store IPA
        script: |
          set -eu
          npm run ios:archive --prefix mobile
          touch mobile/build/testflight-ready
    artifacts:
      - mobile/build/ipa/*.ipa
      - mobile/build/OneStepFlight.xcarchive
      - mobile/build/OneStepFlight.xcarchive/dSYMs/*.dSYM
      - target/surefire-reports/*.xml
    publishing:
      app_store_connect:
        auth: integration
        # This flag submits EXTERNAL beta review; internal distribution uses the API below.
        submit_to_testflight: false
        submit_to_app_store: false
      scripts:
        - name: Make processed build available to internal testers only
          script: |
            # YAML workflows do not expose CM_BUILD_STEP_STATUS. The marker is
            # created only after every test and the signed archive have succeeded.
            if [ -f mobile/build/testflight-ready ]; then
              node mobile/scripts/testflight.mjs distribute
            else
              echo "Build failed; internal distribution skipped."
            fi
