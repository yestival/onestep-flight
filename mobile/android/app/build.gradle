apply plugin: 'com.android.application'

android {
    buildFeatures { buildConfig true }
    namespace = "com.selene.onestepflight"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.selene.onestepflight"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: System.getenv('PROJECT_BUILD_NUMBER') ?: '1')
        versionName System.getenv('ANDROID_VERSION_NAME') ?: new groovy.json.JsonSlurper().parse(file('../../app.config.json')).version
        buildConfigField 'String', 'FLIGHT_API_ORIGIN', '"' + (System.getenv('API_BASE_URL') ?: new groovy.json.JsonSlurper().parse(file('../../app.config.json')).API_BASE_URL) + '"'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        injected {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.injected
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'com.google.android.gms:play-services-base:18.7.2'
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20250517'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def servicesJSON = file('google-services.json')
if (servicesJSON.exists()) {
    def config = new groovy.json.JsonSlurper().parse(servicesJSON)
    if (!config.client.any { it.client_info.android_client_info.package_name == android.defaultConfig.applicationId }) throw new GradleException('Firebase package must match com.selene.onestepflight')
    apply plugin: 'com.google.gms.google-services'
}
if (System.getenv('REQUIRE_FCM') == 'true' && !servicesJSON.exists()) throw new GradleException('REQUIRE_FCM=true requires GOOGLE_SERVICES_JSON_PATH or GOOGLE_SERVICES_JSON_BASE64')
