spring.application.name=onestep-flight
server.address=127.0.0.1
server.port=8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Local development deliberately uses an in-memory database. Share links survive
# browser reloads but not a Spring Boot restart; the prod profile uses PostgreSQL.
spring.datasource.url=jdbc:h2:mem:onestep-flight;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

onestep.share-session.lifetime-hours=48
onestep.share-session.cleanup-enabled=true
onestep.share-session.cleanup-cron=0 0 * * * *
onestep.providers.variflight.enabled=${VARIFLIGHT_ENABLED:false}
