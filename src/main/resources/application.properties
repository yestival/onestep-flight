spring.application.name=onestep-flight
server.address=127.0.0.1
server.port=8080
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:capacitor://localhost,https://localhost}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Local development deliberately uses an in-memory database. Share links survive
# browser reloads but not a Spring Boot restart; the prod profile uses PostgreSQL.
spring.datasource.url=jdbc:h2:mem:onestep-flight;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

onestep.share-session.lifetime-hours=48
onestep.share-session.cleanup-enabled=true
onestep.share-session.cleanup-cron=0 0 * * * *
onestep.providers.variflight.enabled=${VARIFLIGHT_ENABLED:false}
onestep.demo-recording.enabled=true

onestep.mobile.monitor-enabled=${MOBILE_MONITOR_ENABLED:true}
onestep.apns.team-id=${APNS_TEAM_ID:}
onestep.apns.key-id=${APNS_KEY_ID:}
onestep.apns.bundle-id=${APNS_BUNDLE_ID:com.selene.onestepflight}
onestep.apns.private-key-path=${APNS_PRIVATE_KEY_PATH:}
onestep.fcm.credentials-path=${FCM_CREDENTIALS_PATH:}
onestep.fcm.project-id=${FCM_PROJECT_ID:}
spring.task.scheduling.pool.size=2

# Detailed extraction evidence is strictly allow-listed and disabled by default.
onestep.document-extraction.debug=${DOCUMENT_EXTRACTION_DEBUG:false}
