server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
server.tomcat.accesslog.enabled=false
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.h2.console.enabled=false
spring.devtools.add-properties=false
spring.devtools.restart.enabled=false
spring.lifecycle.timeout-per-shutdown-phase=20s

# Do not enable request/header/body or SQL bind logging in the public deployment.
logging.level.root=INFO
logging.level.org.springframework.boot.devtools=OFF
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.client=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

onestep.share-session.lifetime-hours=48
onestep.share-session.cleanup-enabled=true
onestep.share-session.cleanup-cron=0 0 * * * *
onestep.demo-recording.enabled=false
