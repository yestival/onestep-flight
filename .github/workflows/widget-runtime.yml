name: iOS Widget runtime verification
on:
  push:
    branches: ['codex/diagnose-lockscreen']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widget-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            ios: '18-6'
          - runner: macos-26
            ios: '26-2'
    runs-on: ${{ matrix.runner }}
    env:
      SMOKE_IOS: ${{ matrix.ios }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - name: Select Xcode
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort | tail -1)
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devices available
      - run: npm ci --prefix mobile
      - run: npm run sync --prefix mobile
      - name: Run real ActivityKit and Widget in iOS Simulator
        run: node mobile/scripts/widget-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-runtime-evidence-${{ matrix.ios }}
          path: mobile/build/widget-smoke/
