name: Publish Android download

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/main/resources/static/**'
      - '.github/workflows/android-downloads.yml'

permissions:
  contents: read

# Serialize publication so an older build cannot replace a newer download.
concurrency:
  group: android-public-download
  cancel-in-progress: false

jobs:
  publish:
    # Enable automatic public downloads after repository access and signing
    # secrets are configured. Manual runs still validate missing configuration.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ANDROID_DOWNLOADS_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_DOWNLOADS_REPOSITORY: yestival/onestep-flight-android-downloads
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Validate publication credentials and allocate update version
        run: node mobile/scripts/android-downloads.mjs prepare
        env:
          ANDROID_DOWNLOADS_TOKEN: ${{ secrets.ANDROID_DOWNLOADS_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci --prefix mobile
      - run: npm test --prefix mobile
      - name: Android unit tests, lint and signed build
        run: npm run android:check --prefix mobile && npm run android:release --prefix mobile
        env:
          # Website distribution can work before FCM is configured. The separate
          # Codemagic push-release workflow still requires Firebase configuration.
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      - name: Verify signing and prepare the fixed APK filename
        run: node mobile/scripts/android-downloads.mjs package
      - uses: actions/upload-artifact@v4
        with:
          name: android-download
          path: mobile/build/downloads/OneStep-Flight-Android.apk
          if-no-files-found: error
      - name: Upload APK before making the new release latest
        env:
          GH_TOKEN: ${{ secrets.ANDROID_DOWNLOADS_TOKEN }}
        run: |
          set -eu
          gh release create "$ANDROID_DOWNLOAD_TAG" \
            mobile/build/downloads/OneStep-Flight-Android.apk \
            --repo "$ANDROID_DOWNLOADS_REPOSITORY" \
            --title "OneStep Flight for Android" \
            --notes-file mobile/build/downloads/release-body.txt \
            --latest
