name: Publish Android download

on:
  workflow_run:
    workflows: ['Android and backend regression']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: android-public-download-request
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Request an APK only after all regressions pass
        run: node mobile/scripts/android-download-request.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          ANDROID_REGRESSION_RUN_ID: ${{ github.event.workflow_run.id }}
          # This SSH key can write only the downloads repository. Publication
          # uses that repository's own short-lived GITHUB_TOKEN.
          ANDROID_DOWNLOADS_DEPLOY_KEY: ${{ secrets.ANDROID_DOWNLOADS_DEPLOY_KEY }}
