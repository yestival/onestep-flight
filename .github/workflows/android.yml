name: Android and backend regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', 'src/**', 'pom.xml', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'src/**', 'pom.xml', '.github/workflows/android.yml']
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: mobile/package-lock.json}
      - run: npm ci --prefix mobile
      - run: npx --prefix mobile playwright install --with-deps chromium webkit
      - run: npm run test:browser --prefix mobile
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: onestep_migration
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - run: bash mvnw -B test
        env:
          MIGRATION_POSTGRES_URL: jdbc:postgresql://localhost:5432/onestep_migration
          MIGRATION_POSTGRES_USER: postgres
          MIGRATION_POSTGRES_PASSWORD: test-only
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: mobile/package-lock.json}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci --prefix mobile
      - run: npm test --prefix mobile
      - run: npm run android:check --prefix mobile
      - name: Reserve disk space for Android 16 userdata
        run: |
          # This Java/Kotlin app uses no NDK. API 36 enforces a userdata minimum
          # larger than the requested partition, so free actual SDK disk space.
          sdkmanager --list_installed > "$RUNNER_TEMP/onestep-sdk-packages.txt"
          while IFS= read -r package; do
            sdkmanager --uninstall "$package"
          done < <(awk '$1 ~ /^ndk;/ {print $1}' "$RUNNER_TEMP/onestep-sdk-packages.txt")
          df -h "$HOME"
      - name: Enable Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native notification lifecycle on Google APIs Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disk-size: 4096M
          ram-size: 2048M
          emulator-boot-timeout: 300
          # Use a supported explicit renderer. Emulator 37 does not list "off"
          # as a GPU mode and falls back to ANGLE. Keep host output out of the
          # action's completed boot pipe and retain it for crash diagnosis.
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none > emulator-host.log 2>&1
          script: |
            adb logcat -v threadtime > android-logcat.txt &
            timeout 10m npm run android:test:native --prefix mobile
            timeout 12m npm run android:test:emulator --prefix mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/reports/
            mobile/android/app/build/outputs/androidTest-results/
            mobile/build/emulator-tests/
            android-logcat.txt
            emulator-host.log
